[project]
name = "robotcell-protocol"
version = "0.1.0"
description = "Wire contract shared by the cloud and the on-prem server"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robotcell_protocol"]
