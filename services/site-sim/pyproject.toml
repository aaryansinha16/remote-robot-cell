[project]
name = "robotcell-site-sim"
version = "0.1.0"
description = "Simulated site: publishes fusion/objects and injects robot faults"
requires-python = ">=3.12"
dependencies = [
    "robotcell-protocol",
    "aiomqtt>=2.3",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
robotcell-protocol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sitesim"]
