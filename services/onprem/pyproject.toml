[project]
name = "robotcell-onprem"
version = "0.1.0"
description = "On-prem server: decides on jobs, runs the robots, enforces the safety pause, reports to the cloud"
requires-python = ">=3.12"
dependencies = [
    "robotcell-protocol",
    "aiomqtt>=2.3",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
]

[tool.uv.sources]
robotcell-protocol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onprem"]
