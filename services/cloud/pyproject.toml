[project]
name = "robotcell-cloud"
version = "0.1.0"
description = "Cloud API: job intake, MQTT bridge to sites, live updates for the web app"
requires-python = ">=3.12"
dependencies = [
    "robotcell-protocol",
    "aiomqtt>=2.3",
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
robotcell-protocol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud"]
