[project]
name = "robot-cell"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "robotcell-protocol",
    "robotcell-cloud",
    "robotcell-onprem",
    "robotcell-site-sim",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/protocol", "services/cloud", "services/onprem", "services/site-sim"]

[tool.uv.sources]
robotcell-protocol = { workspace = true }
robotcell-cloud = { workspace = true }
robotcell-onprem = { workspace = true }
robotcell-site-sim = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["RUF012", "ASYNC110"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages/protocol/tests", "services/cloud/tests", "services/onprem/tests", "services/site-sim/tests"]
addopts = "--import-mode=importlib"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
